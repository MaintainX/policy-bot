name: MaintainX release

# Builds the patched image with upstream's own toolchain and publishes it to GHCR.
# Replaces upstream's build.yml, which publishes to palantir's Docker Hub.
on:
  push:
    tags:
      - "v*-mx.*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GOPATH: /home/runner/go
      IMAGE: ghcr.io/maintainx/policy-bot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set Go version
        id: go_version
        run: |
          GO_VERSION=$(sed -E -n '/^go / s/^go ([0-9]+\.[0-9]+)(\.[0-9]+)?$/\1/p' < go.mod)
          echo "version=${GO_VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go_version.outputs.version }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24

      - name: Test
        run: go test -mod=vendor ./...

      - name: Build frontend
        run: |
          yarn install --frozen-lockfile
          yarn run build:production

      - name: Build distribution and image
        run: |
          ./godelw dist
          ./godelw docker build --verbose

      - name: Tag image
        id: tag
        run: |
          VERSION=$(./godelw project-version)
          docker tag "palantirtechnologies/policy-bot:${VERSION}" "${IMAGE}:${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          docker push "${IMAGE}:${{ steps.tag.outputs.version }}"
          docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${{ steps.tag.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
